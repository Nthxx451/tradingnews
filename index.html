<script>
  // localStorage-backed polyfill matching the window.storage API the app already calls.
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem("td_" + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem("td_" + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem("td_" + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = "td_" + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(3));
      return { keys, prefix, shared: !!shared };
    },
  };
</script>

// Real, no-key, CORS-friendly feeds for BTC and EUR/USD.

// Some free APIs don't send browser-friendly CORS headers on every network
// (mobile Safari standalone apps are stricter). If the direct call fails,
// retry through a couple of public CORS proxies before giving up.
const CORS_PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
];
async function fetchJsonWithFallback(url) {
  try {
    const r = await fetch(url);
    if (r.ok) return await r.json();
  } catch (e) {
    /* fall through to proxies */
  }
  for (const makeProxyUrl of CORS_PROXIES) {
    try {
      const r = await fetch(makeProxyUrl(url));
      if (r.ok) return await r.json();
    } catch (e) {
      /* try next proxy */
    }
  }
  throw new Error("fetch-failed: " + url);
}

async function fetchBTC() {
  const d = await fetchJsonWithFallback("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
  if (!d?.bitcoin?.usd) throw new Error("coingecko-empty");
  return d.bitcoin.usd;
}
async function fetchEUR() {
  const d = await fetchJsonWithFallback("https://api.frankfurter.dev/v2/rate/EUR/USD");
  if (!d?.rate) throw new Error("frankfurter-empty");
  return d.rate;
}
async function fetchAAPL(key) {
  const d = await fetchJsonWithFallback(`https://finnhub.io/api/v1/quote?symbol=AAPL&token=${encodeURIComponent(key)}`);
  if (!d?.c) throw new Error("finnhub-empty");
  return d.c;
}
async function fetchXAU(key) {
  const d = await fetchJsonWithFallback(`https://api.metalpriceapi.com/v1/latest?api_key=${encodeURIComponent(key)}&base=USD&currencies=XAU`);
  const rate = d?.rates?.XAU;
  if (!rate) throw new Error("metalpriceapi-empty");
  return 1 / rate;
}

/* ------------------------------------------------------------------ */
/* Live economic calendar — Forex Factory weekly feed (free, no key)  */
/* Same public feed MT5 EAs use for news filters. Rate-limited by the */
/* source itself, so we only refetch a few times per session.        */
/* ------------------------------------------------------------------ */
function currencyToAssets(currency) {
  if (currency === "USD") return ["XAUUSD", "EURUSD", "BTCUSD", "AAPL"];
  if (currency === "EUR") return ["EURUSD"];
  return [];
}
function ffImpactToLevel(impact) {
  if (impact === "High") return 3;
  if (impact === "Medium") return 2;
  if (impact === "Low") return 1;
  return 0; // Holiday / non-graded — dropped
}
function frDayLabel(d) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dd = new Date(d);
  dd.setHours(0, 0, 0, 0);
  const diffDays = Math.round((dd - today) / 86400000);
  if (diffDays === 0) return "Aujourd'hui";
  if (diffDays === 1) return "Demain";
  const weekday = dd.toLocaleDateString("fr-FR", { weekday: "long" });
  return weekday.charAt(0).toUpperCase() + weekday.slice(1);
}
function frDateLabel(d) {
  return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
}

async function fetchCalendarFF() {
  const hosts = [
    "https://nfs.faireconomy.media/ff_calendar_thisweek.json",
    "https://cdn-nfs.faireconomy.media/ff_calendar_thisweek.json",
  ];
  const attempts = [];
  hosts.forEach((h) => {
    attempts.push(h);
    CORS_PROXIES.forEach((makeProxyUrl) => attempts.push(makeProxyUrl(h)));
    attempts.push(`https://r.jina.ai/${h}`); // text-mode reader, last-resort bypass
  });
  let lastErr = null;
  for (const url of attempts) {
    try {
      const r = await fetch(url);
      if (!r.ok) { lastErr = new Error("http-" + r.status); continue; }
      const text = await r.text();
      const d = JSON.parse(text);
      if (Array.isArray(d) && d.length > 0) return d;
      lastErr = new Error("empty-or-not-array");
    } catch (e) {
      lastErr = e; // likely blocked / rate-limited / returned HTML — try next
    }
  }
  throw lastErr || new Error("ff-calendar-all-failed");
}

function groupCalendar(raw) {
  const byDate = {};
  raw.forEach((ev) => {
    const assets = currencyToAssets(ev.country);
    const impact = ffImpactToLevel(ev.impact);
    if (assets.length === 0 || impact < 2 || !ev.date) return; // skip irrelevant currencies + low-impact noise
    const dateObj = new Date(ev.date);
    if (isNaN(dateObj)) return;
    const dateKey = dateObj.toISOString().slice(0, 10);
    if (!byDate[dateKey]) byDate[dateKey] = { dateObj, items: [] };
    byDate[dateKey].items.push({
      time: dateObj.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
      title: ev.title,
      zone: ev.country,
      impact,
      assets,
      why: `Donnée macro ${ev.country} classée impact ${IMPACT_LABEL[impact].toLowerCase()} — peut faire bouger le dollar et les actifs qui y sont liés.`,
      sortKey: dateObj.getTime(),
    });
  });
  return Object.keys(byDate)
    .sort()
    .map((dateKey) => ({
      day: frDayLabel(byDate[dateKey].dateObj),
      date: frDateLabel(byDate[dateKey].dateObj),
      items: byDate[dateKey].items.sort((a, b) => a.sortKey - b.sortKey),
    }));
}

function useLiveCalendar(live) {
  const [state, setState] = useState({ days: null, status: "idle" });
  useEffect(() => {
    if (!live.newsEnabled) {
      setState({ days: null, status: "idle" });
      return;
    }
    let cancelled = false;
    function load() {
      setState((s) => ({ ...s, status: s.days ? s.status : "loading" }));
      fetchCalendarFF()
        .then((raw) => {
          if (cancelled) return;
          setState({ days: groupCalendar(raw), status: "live" });
        })
        .catch(() => {
          if (!cancelled) setState((s) => ({ days: s.days, status: "error" }));
        });
    }
    load();
    const interval = setInterval(load, 45000);
    return () => {
      cancelled = true;
      clearInterval(interval);
    };
  }, [live.newsEnabled]);
  return state;
}

function useQuotesEngine(assetIds, live) {
  const [quotes, setQuotes] = useState(() => {
    const initial = {};
    assetIds.forEach((id) => {
      const b = BASE_QUOTES[id];
      initial[id] = { ...b, prevBid: b.bid, dir: 0, open: b.bid };
    });
    return initial;
  });
  const [status, setStatus] = useState({});

  // Fast local jitter — keeps every row feeling alive between real fetches.
  useEffect(() => {
    const interval = setInterval(() => {
      setQuotes((prev) => {
        const next = { ...prev };
        assetIds.forEach((id) => {
          const q = prev[id] || { ...BASE_QUOTES[id], prevBid: BASE_QUOTES[id].bid, open: BASE_QUOTES[id].bid };
          const base = BASE_QUOTES[id];
          const move = (Math.random() - 0.5) * base.step * 2;
          const newBid = Math.max(0, q.bid + move);
          const spread = base.ask - base.bid;
          next[id] = {
            ...q,
            prevBid: q.bid,
            bid: newBid,
            ask: newBid + spread,
            low: Math.min(q.low, newBid),
            high: Math.max(q.high, newBid),
            dir: newBid > q.bid ? 1 : newBid < q.bid ? -1 : 0,
          };
        });
        return next;
      });
    }, 1400);
    return () => clearInterval(interval);
  }, [assetIds.join(",")]);

  // Slower real-price sync — snaps the anchor back to reality when a feed is enabled.
  useEffect(() => {
    let cancelled = false;
    async function syncOne(id, fetcher) {
      try {
        const price = await fetcher();
        if (cancelled) return;
        setQuotes((prev) => {
          const q = prev[id];
          if (!q) return prev;
          const base = BASE_QUOTES[id];
          const spread = base.ask - base.bid;
          return {
            ...prev,
            [id]: {
              ...q,
              prevBid: q.bid,
              bid: price,
              ask: price + spread,
              low: Math.min(q.low, price),
              high: Math.max(q.high, price),
            },
          };
        });
        setStatus((s) => ({ ...s, [id]: "live" }));
      } catch (e) {
        if (!cancelled) setStatus((s) => ({ ...s, [id]: "error" }));
      }
    }
    function syncAll() {
      if (live.BTCUSD && assetIds.includes("BTCUSD")) syncOne("BTCUSD", fetchBTC);
      if (live.EURUSD && assetIds.includes("EURUSD")) syncOne("EURUSD", fetchEUR);
      if (live.aaplEnabled && live.aaplKey && assetIds.includes("AAPL")) syncOne("AAPL", () => fetchAAPL(live.aaplKey));
      if (live.xauEnabled && live.xauKey && assetIds.includes("XAUUSD")) syncOne("XAUUSD", () => fetchXAU(live.xauKey));
    }
    syncAll();
    const interval = setInterval(syncAll, 20000);
    return () => {
      cancelled = true;
      clearInterval(interval);
    };
  }, [assetIds.join(","), live.BTCUSD, live.EURUSD, live.aaplEnabled, live.aaplKey, live.xauEnabled, live.xauKey]);

  return { quotes, status };
}

function formatPrice(id, value) {
  if (id === "EURUSD") return value.toFixed(4);
  if (id === "BTCUSD") return value.toFixed(1);
  return value.toFixed(2);
}

// Split into "small" prefix and "bold" last two significant digits, like the MT5 screenshot.
function splitPrice(id, value) {
  const str = formatPrice(id, value);
  return { head: str.slice(0, -2), tail: str.slice(-2) };
}

  const toggleAsset = (id) => {
    setWatchlist((prev) =>

    );
  };

  const [testing, setTesting] = useState({});
  const [testResult, setTestResult] = useState({});

  async function runTest(id, fn) {
    setTesting((s) => ({ ...s, [id]: true }));
    try {
      await fn();
      setTestResult((s) => ({ ...s, [id]: "ok" }));
    } catch (e) {
      setTestResult((s) => ({ ...s, [id]: "error" }));
    } finally {
      setTesting((s) => ({ ...s, [id]: false }));

  return (

        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: 1, color: "#6B7280", margin: "20px 0 10px", textTransform: "uppercase" }}>
          Notifications
        </div>
        <ToggleRow
          label="Alertes actus fortes"
          sub="Être prévenu avant une publication à fort impact"
          checked={notif}
          onChange={() => setNotif((v) => !v)}
        />
        <ToggleRow
          label="Uniquement impact fort"
          sub="Masquer les actus faible/moyen impact dans le calendrier"
          checked={highImpactOnly}
          onChange={() => setHighImpactOnly((v) => !v)}
        />

        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: 1, color: "#6B7280", margin: "20px 0 10px", textTransform: "uppercase" }}>
          Connexions temps réel — cotations
        </div>

        <ToggleRow
          label="Bitcoin (CoinGecko)"
          sub="Gratuit, sans clé — activable directement"
          checked={live.BTCUSD}
          onChange={() => setLive((v) => ({ ...v, BTCUSD: !v.BTCUSD }))}
        />
        <ToggleRow
          label="Euro / Dollar (Frankfurter)"
          sub="Gratuit, sans clé — activable directement"
          checked={live.EURUSD}
          onChange={() => setLive((v) => ({ ...v, EURUSD: !v.EURUSD }))}
        />

        <ApiKeyField
          label="AAPL — clé Finnhub"
          sub="Nécessite un compte gratuit sur finnhub.io"
          value={live.aaplKey}
          onChange={(v) => setLive((s) => ({ ...s, aaplKey: v }))}
          placeholder="Colle ta clé API ici"
          testing={!!testing.AAPL}
          testStatus={testResult.AAPL}
          onTest={() => runTest("AAPL", () => fetchAAPL(live.aaplKey))}
        />
        <ToggleRow
          label="Activer AAPL en direct"
          sub="Utilise la clé ci-dessus une fois testée"
          checked={live.aaplEnabled}
          onChange={() => setLive((v) => ({ ...v, aaplEnabled: !v.aaplEnabled }))}
        />

        <ApiKeyField
          label="XAUUSD — clé fournisseur métaux"
          sub="Type metalpriceapi.com — le CORS dépend du fournisseur, teste avant d'activer"
          value={live.xauKey}
          onChange={(v) => setLive((s) => ({ ...s, xauKey: v }))}
          placeholder="Colle ta clé API ici"
          testing={!!testing.XAUUSD}
          testStatus={testResult.XAUUSD}
          onTest={() => runTest("XAUUSD", () => fetchXAU(live.xauKey))}
        />
        <ToggleRow
          label="Activer l'or en direct"
          sub="Utilise la clé ci-dessus une fois testée"
          checked={live.xauEnabled}
          onChange={() => setLive((v) => ({ ...v, xauEnabled: !v.xauEnabled }))}
        />

        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: 1, color: "#6B7280", margin: "20px 0 10px", textTransform: "uppercase" }}>
          Connexion — calendrier économique
        </div>
        <ToggleRow
          label="Calendrier économique (Forex Factory)"
          sub="Gratuit, sans clé — le même flux utilisé par les EA MT5 pour filtrer les news"
          checked={live.newsEnabled}
          onChange={() => setLive((v) => ({ ...v, newsEnabled: !v.newsEnabled }))}
        />
        <div
          style={{
            display: "flex",
            gap: 8,
            alignItems: "flex-start",
            padding: 12,
            background: "#14171C",
            border: "1px dashed #2A2E35",
            borderRadius: 10,
          }}
        >
          <Info size={14} color="#6B7280" style={{ flexShrink: 0, marginTop: 2 }} />
          <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: "#6B7280", lineHeight: 1.5 }}>
            Ce flux couvre les vraies publications macro (taux, inflation, emploi...) qui bougent le dollar et
            l'euro. Les événements propres à une entreprise (ex. earnings AAPL) n'y sont pas — ça reste en démo
            pour cette partie. Si l'activation échoue, l'onglet Actus repasse automatiquement en démo.
          </span>
        </div>

        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: 1, color: "#6B7280", margin: "20px 0 10px", textTransform: "uppercase" }}>
          À propos des données
        </div>
        <div
          style={{
            background: "#14171C",
            border: "1px solid #22262D",
            borderRadius: 12,
            padding: 16,
          }}
        >
          <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: "#8A8F98", lineHeight: 1.6, margin: 0, marginBottom: 10 }}>
            Bitcoin et EUR/USD peuvent tourner en vrai temps réel dès maintenant, sans rien configurer. AAPL et
            l'or ont besoin d'une clé API personnelle — teste-la avant d'activer le direct.
          </p>
          <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: "#8A8F98", lineHeight: 1.6, margin: 0 }}>
            Les clés restent uniquement dans cet artifact, sur cet appareil.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Bottom nav + App shell                                             */
/* ------------------------------------------------------------------ */
const TABS = [
  { id: "news", label: "Actus", icon: Newspaper },
  { id: "strategies", label: "Stratégies", icon: LineChart },
  { id: "quotes", label: "Cotations", icon: Activity },
  { id: "settings", label: "Réglages", icon: SettingsIcon },
];

const DEFAULT_LIVE = {
  BTCUSD: false,
  EURUSD: false,
  aaplKey: "",
  aaplEnabled: false,
  xauKey: "",
  xauEnabled: false,
  newsEnabled: false,
};

export default function TradingDesk() {
  const [tab, setTab] = useState("news");
  const [watchlist, setWatchlist] = useState(["XAUUSD", "BTCUSD", "EURUSD", "AAPL"]);
  const [notif, setNotif] = useState(true);
  const [highImpactOnly, setHighImpactOnly] = useState(false);
  const [live, setLive] = useState(DEFAULT_LIVE);
  const [liveLoaded, setLiveLoaded] = useState(false);

  // Load saved connection settings once, on this device.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const r = await window.storage.get("live-settings", false);
        if (!cancelled && r && r.value) {
          setLive({ ...DEFAULT_LIVE, ...JSON.parse(r.value) });
        }
      } catch (e) {
        // nothing saved yet
      } finally {
        if (!cancelled) setLiveLoaded(true);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  // Persist whenever the connection settings change.
  useEffect(() => {
    if (!liveLoaded) return;
    window.storage.set("live-settings", JSON.stringify(live), false).catch(() => {});
  }, [live, liveLoaded]);

  return (
    <div
      style={{
        maxWidth: 430,
        margin: "0 auto",
        minHeight: "100vh",
        background: "#0B0D10",
        color: "#EDEBE6",
        fontFamily: "'Inter', sans-serif",
        position: "relative",
      }}
    >
      <style>{FONT_IMPORT}</style>

      <div style={{ paddingBottom: 90 }}>
        {tab === "news" && <NewsTab live={live} />}
        {tab === "strategies" && <StrategiesTab />}
        {tab === "quotes" && <QuotesTab watchlist={watchlist.length ? watchlist : ["XAUUSD"]} live={live} />}
        {tab === "settings" && (
          <SettingsTab
            watchlist={watchlist}
            setWatchlist={setWatchlist}
            notif={notif}
            setNotif={setNotif}
            highImpactOnly={highImpactOnly}
            setHighImpactOnly={setHighImpactOnly}
            live={live}
            setLive={setLive}
          />
        )}
      </div>

      <div
        style={{
          position: "fixed",
          bottom: 0,
          left: "50%",
          transform: "translateX(-50%)",
          width: "100%",
          maxWidth: 430,
          background: "rgba(15,17,21,0.92)",
          backdropFilter: "blur(14px)",
          borderTop: "1px solid #22262D",
          display: "flex",
          padding: "10px 6px calc(10px + env(safe-area-inset-bottom))",
        }}
      >
        {TABS.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                flex: 1,
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 4,
                padding: "6px 2px",
              }}
            >
              <Icon size={21} color={active ? PRIMARY : "#5C616A"} strokeWidth={active ? 2.3 : 2} />
              <span
                style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 10,
                  fontWeight: 600,
                  color: active ? "transparent" : "#5C616A",
                  backgroundImage: active ? GRADIENT : "none",
                  backgroundClip: active ? "text" : "unset",
                  WebkitBackgroundClip: active ? "text" : "unset",
                }}
              >
                {t.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
createRoot(rootEl).render(<TradingDesk />);
</script>
</body>
</html>
