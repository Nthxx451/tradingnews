<script>
  // localStorage-backed polyfill matching the window.storage API the app already calls.
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem("td_" + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem("td_" + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem("td_" + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = "td_" + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(3));
      return { keys, prefix, shared: !!shared };
    },
  };
</script>

// Some free APIs don't send browser-friendly CORS headers on every network
// (mobile Safari standalone apps are stricter). If the direct call fails,
// retry through a couple of public CORS proxies before giving up.
const CORS_PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
];
async function fetchJsonWithFallback(url) {
  try {
    const r = await fetch(url);
    if (r.ok) return await r.json();
  } catch (e) {
    /* fall through to proxies */
  }
  for (const makeProxyUrl of CORS_PROXIES) {
    try {
      const r = await fetch(makeProxyUrl(url));
      if (r.ok) return await r.json();
    } catch (e) {
      /* try next proxy */
    }
  }
  throw new Error("fetch-failed: " + url);
}

/* Live economic calendar — Forex Factory weekly feed (free, no key)  */
/* Same public feed MT5 EAs use for news filters. Rate-limited by the */
/* source itself, so we only refetch a few times per session.        */
/* ------------------------------------------------------------------ */
function currencyToAssets(currency) {
  if (currency === "USD") return ["XAUUSD", "EURUSD", "BTCUSD", "AAPL"];
  if (currency === "EUR") return ["EURUSD"];
  return [];
}
function ffImpactToLevel(impact) {
  if (impact === "High") return 3;
  if (impact === "Medium") return 2;
  if (impact === "Low") return 1;
  return 0; // Holiday / non-graded — dropped
}
function frDayLabel(d) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dd = new Date(d);
  dd.setHours(0, 0, 0, 0);
  const diffDays = Math.round((dd - today) / 86400000);
  if (diffDays === 0) return "Aujourd'hui";
  if (diffDays === 1) return "Demain";
  const weekday = dd.toLocaleDateString("fr-FR", { weekday: "long" });
  return weekday.charAt(0).toUpperCase() + weekday.slice(1);
}
function frDateLabel(d) {
  return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
}
function localDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// The faireconomy feed serves valid JSON but sends no CORS headers and
// rate-limits requests that carry a browser Origin header (HTTP 429), so it
// can't be fetched directly from a web page. r.jina.ai is a CORS-enabled
// reader that can reach it and echoes back the JSON (wrapped in a short
// markdown header) — we use it first and keep direct + proxy routes as backup.
function parseFFPayload(text) {
  let t = (text || "").trim();
  const start = t.indexOf("[");
  const end = t.lastIndexOf("]");
  if (start !== -1 && end > start) t = t.slice(start, end + 1);
  return JSON.parse(t);
}

async function fetchCalendarFF() {
  const host = "https://nfs.faireconomy.media/ff_calendar_thisweek.json";
  const attempts = [
    `https://r.jina.ai/${host}`,
    host,
    `https://cdn-nfs.faireconomy.media/ff_calendar_thisweek.json`,
  ];
  CORS_PROXIES.forEach((makeProxyUrl) => attempts.push(makeProxyUrl(host)));
  let lastErr = null;
  for (const url of attempts) {
    try {
      const r = await fetch(url);
      if (!r.ok) { lastErr = new Error("http-" + r.status); continue; }
      const text = await r.text();
      const d = parseFFPayload(text);
      if (Array.isArray(d) && d.length > 0) return d;
      lastErr = new Error("empty-or-not-array");
    } catch (e) {
      lastErr = e; // likely blocked / rate-limited / returned HTML — try next
    }
  }
  throw lastErr || new Error("ff-calendar-all-failed");
}

function groupCalendar(raw) {
  const byDate = {};
  raw.forEach((ev) => {
    const assets = currencyToAssets(ev.country);
    const impact = ffImpactToLevel(ev.impact);
    if (assets.length === 0 || impact < 2 || !ev.date) return; // skip irrelevant currencies + low-impact noise
    const dateObj = new Date(ev.date);
    if (isNaN(dateObj)) return;
    const dateKey = localDateKey(dateObj);
    if (!byDate[dateKey]) byDate[dateKey] = [];
    byDate[dateKey].push({
      time: dateObj.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
      title: ev.title,
      zone: ev.country,
      impact,
      assets,
      why: `Donnée macro ${ev.country} classée impact ${IMPACT_LABEL[impact].toLowerCase()} — peut faire bouger le dollar et les actifs qui y sont liés.`,
      sortKey: dateObj.getTime(),
    });
  });

  // Fenêtre glissante : aujourd'hui + 3 jours. À chaque rafraîchissement (45 s),
  // le jour précédent disparaît et un nouveau jour apparaît à la fin, dès qu'on
  // passe minuit. Les jours sans actu macro restent affichés (message dédié).
  const days = [];
  const today = new Date();
  for (let i = 0; i < 4; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const items = (byDate[localDateKey(d)] || []).sort((a, b) => a.sortKey - b.sortKey);
    days.push({
      dateKey: localDateKey(d),
      day: frDayLabel(d),
      date: frDateLabel(d),
      items,
    });
  }
  return days;
}

function useLiveCalendar(live) {
  const [state, setState] = useState({ days: null, status: "idle" });
  useEffect(() => {
    if (!live.newsEnabled) {
      setState({ days: null, status: "idle" });
      return;
    }
    let cancelled = false;
    function load() {
      setState((s) => ({ ...s, status: s.days ? s.status : "loading" }));
      fetchCalendarFF()
        .then((raw) => {
          if (cancelled) return;
          setState({ days: groupCalendar(raw), status: "live" });
        })
        .catch(() => {
          if (!cancelled) setState((s) => ({ days: s.days, status: "error" }));
        });
    }
    load();
    const interval = setInterval(load, 45000);
    return () => {
      cancelled = true;
      clearInterval(interval);
    };
  }, [live.newsEnabled]);
  return state;
}

function useQuotesEngine(assetIds, live) {
  const [quotes, setQuotes] = useState(() => {
    const initial = {};
    assetIds.forEach((id) => {
      const b = BASE_QUOTES[id];
      const anchor = lastKnownPrice[id] || b.bid;
      const spread = b.ask - b.bid;
      initial[id] = { ...b, prevBid: anchor, bid: anchor, ask: anchor + spread, open: anchor, low: anchor, high: anchor, dir: 0 };
    });
    return initial;
  });
  const [status, setStatus] = useState({});

  // Fast local jitter — keeps every row feeling alive between real fetches.
  useEffect(() => {
    const interval = setInterval(() => {
      setQuotes((prev) => {
        const next = { ...prev };
        assetIds.forEach((id) => {
          const q = prev[id] || { ...BASE_QUOTES[id], prevBid: BASE_QUOTES[id].bid, open: BASE_QUOTES[id].bid };
          const base = BASE_QUOTES[id];
          const move = (Math.random() - 0.5) * base.step * 2;
          const newBid = Math.max(0, q.bid + move);
          const spread = base.ask - base.bid;
          next[id] = {
            ...q,
            prevBid: q.bid,
            bid: newBid,
            ask: newBid + spread,
            low: Math.min(q.low, newBid),
            high: Math.max(q.high, newBid),
            dir: newBid > q.bid ? 1 : newBid < q.bid ? -1 : 0,
          };
        });
        return next;
      });
    }, 1400);
    return () => clearInterval(interval);
  }, [assetIds.join(",")]);

  // Slower real-price sync — snaps the anchor back to reality when a feed is enabled.
  useEffect(() => {
    let cancelled = false;
    async function syncOne(id, fetcher) {
      try {
        const price = await fetcher();
        if (cancelled) return;
        lastKnownPrice[id] = price;
        setQuotes((prev) => {
          const q = prev[id];
          if (!q) return prev;
          const base = BASE_QUOTES[id];
          const spread = base.ask - base.bid;
          // Premier ancrage réel : si le prix réel est loin du prix de démo,
          // on recale la référence de session (open/haut/bas) sur le prix réel.
          const bigJump = Math.abs(price - q.bid) > Math.max(base.step * 20, Math.abs(q.bid) * 0.01);
          return {
            ...prev,
            [id]: {
              ...q,
              prevBid: q.bid,
              bid: price,
              ask: price + spread,
              open: bigJump ? price : q.open,
              low: bigJump ? price : Math.min(q.low, price),
              high: bigJump ? price : Math.max(q.high, price),
            },
          };
        });
        setStatus((s) => ({ ...s, [id]: "live" }));
      } catch (e) {
        if (!cancelled) setStatus((s) => ({ ...s, [id]: "error" }));
      }
    }
    function syncAll() {
      if (live.BTCUSD && assetIds.includes("BTCUSD")) syncOne("BTCUSD", fetchBTC);
      if (live.EURUSD && assetIds.includes("EURUSD")) syncOne("EURUSD", fetchEUR);
      if (live.aaplEnabled && assetIds.includes("AAPL")) syncOne("AAPL", fetchAAPL);
      if (live.xauEnabled && assetIds.includes("XAUUSD")) syncOne("XAUUSD", fetchXAU);
    }
    syncAll();
    const interval = setInterval(syncAll, 20000);
    return () => {
      cancelled = true;
      clearInterval(interval);
    };
  }, [assetIds.join(","), live.BTCUSD, live.EURUSD, live.aaplEnabled, live.xauEnabled]);

  return { quotes, status };
}

function formatPrice(id, value) {
  if (id === "EURUSD") return value.toFixed(4);
  if (id === "BTCUSD") return value.toFixed(1);
  return value.toFixed(2);
}

// Split into "small" prefix and "bold" last two significant digits, like the MT5 screenshot.
function splitPrice(id, value) {
  const str = formatPrice(id, value);
  return { head: str.slice(0, -2), tail: str.slice(-2) };
}

/* ------------------------------------------------------------------ */
/* Tab: Graphique (live chart)                                        */
/* ------------------------------------------------------------------ */
// Candlestick (bougies japonaises) — live chart model.
const TIMEFRAMES = [
  { id: "M1", label: "M1", ms: 60 * 1000 },
  { id: "M5", label: "M5", ms: 5 * 60 * 1000 },
  { id: "M15", label: "M15", ms: 15 * 60 * 1000 },
  { id: "H1", label: "H1", ms: 60 * 60 * 1000 },
  { id: "H4", label: "H4", ms: 4 * 60 * 60 * 1000 },
  { id: "D1", label: "D1", ms: 24 * 60 * 60 * 1000 },
];
const SEED_CANDLE_COUNT = 240;
const MAX_CANDLES = 600;
const MIN_VIEW_CANDLES = 8;
const MAX_VIEW_CANDLES = 140;
const DEFAULT_VIEW_CANDLES = 40;
const CHART_PAD = { top: 12, right: 62, bottom: 24, left: 8 };

// Combien d'historique générer selon la temporalité choisie.
function seedCountFor(intervalMs) {
  if (intervalMs >= 86400000) return 365; // D1 : ~1 an d'historique
  if (intervalMs >= 3600000) return 300;  // H1 / H4
  return 240;                             // M1 / M5 / M15
}

// Cache des séries de bougies par actif+temporalité : quand on change d'actif
// puis qu'on revient, on retrouve le même historique (continuité au lieu d'un
// nouveau tirage aléatoire à chaque visite).
const candleCache = new Map(); // clé : `${assetId}|${intervalMs}`

// Synthetic candle history (OHLC) ending on the last known real price (or the
// asset's base bid) so the live candles continue it seamlessly.
function seedCandles(id, n = SEED_CANDLE_COUNT, intervalMs = TIMEFRAMES[0].ms) {
  const base = BASE_QUOTES[id];
  const anchor = lastKnownPrice[id] || base.bid;
  const s = base.step;
  const now = Date.now();
  const bucket = Math.floor(now / intervalMs);
  const closes = [];
  let price = anchor;
  let vel = 0;
  for (let i = 0; i < n; i++) {
    vel = vel * 0.9 + (Math.random() - 0.5) * s * 0.7;
    price += vel;
    closes.push(price);
  }
  const shift = anchor - closes[closes.length - 1];
  const candles = [];
  let prevClose = closes[0] + shift;
  for (let i = 0; i < n; i++) {
    const close = closes[i] + shift;
    const open = i === 0 ? close - (Math.random() - 0.5) * s : prevClose;
    const hi = Math.max(open, close) + Math.random() * s * 0.9;
    const lo = Math.min(open, close) - Math.random() * s * 0.9;
    candles.push({
      t: (bucket - (n - 1 - i)) * intervalMs,
      o: open,
      h: hi,
      l: lo,
      c: close,
    });
    prevClose = close;
  }
  return candles;
}

// Étiquette de temps adaptée à la temporalité de la bougie.
function candleTimeLabel(t, intervalMs) {
  const d = new Date(t);
  if (intervalMs >= 86400000) {
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }
  if (intervalMs >= 3600000) {
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const hh = String(d.getHours()).padStart(2, "0");
    const mi = String(d.getMinutes()).padStart(2, "0");
    return `${dd}/${mm} ${hh}:${mi}`;
  }
  return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function formatAxis(id, v) {
  if (id === "EURUSD") return v.toFixed(4);
  if (id === "BTCUSD") return v.toFixed(0);
  if (id === "XAUUSD") return v.toFixed(1);
  return v.toFixed(2);
}

function useMeasure(ref) {
  const [width, setWidth] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const update = () => setWidth(el.clientWidth);
    update();
    if (typeof ResizeObserver !== "undefined") {
      const ro = new ResizeObserver(update);
      ro.observe(el);
      return () => ro.disconnect();
    }
    window.addEventListener("resize", update);
    return () => window.removeEventListener("resize", update);
  }, []);
  return width;
}

function CandleChartSvg({ candles, start, count, width, asset, intervalMs }) {
  const W = width || 320;
  const H = Math.min(340, Math.max(230, Math.round(W * 0.62)));
  const PAD = CHART_PAD;
  const innerW = W - PAD.left - PAD.right;
  const innerH = H - PAD.top - PAD.bottom;

  const visible = candles.slice(start, start + count);
  let min = Infinity;
  let max = -Infinity;
  visible.forEach((c) => {
    if (c.l < min) min = c.l;
    if (c.h > max) max = c.h;
  });
  if (!(max > min)) {
    const m = Math.abs(max) || 1;
    max = m * 1.001;
    min = m * 0.999;
  }
  const span = max - min;
  min -= span * 0.08;
  max += span * 0.08;

  const step = innerW / Math.max(1, count);
  const bodyW = Math.max(2, step * 0.62);
  const y = (p) => PAD.top + innerH - ((p - min) / (max - min)) * innerH;

  const grid = [0, 1, 2, 3, 4].map((i) => ({
    v: max - ((max - min) * i) / 4,
    yy: PAD.top + (innerH * i) / 4,
  }));
  // Au moins ~68 px entre deux étiquettes de temps, quel que soit le zoom.
  const labelEvery = Math.max(1, Math.ceil(68 / step));

  const lastCandle = visible[visible.length - 1];
  const lastY = lastCandle ? y(lastCandle.c) : PAD.top;
  const lastUp = lastCandle ? lastCandle.c >= lastCandle.o : true;
  const lastColor = lastUp ? "#2FBF71" : "#FF3EA5";

  return (
    <svg width={W} height={H} style={{ display: "block" }}>
      {grid.map((g, i) => (
        <g key={i}>
          <line x1={PAD.left} y1={g.yy} x2={W - PAD.right} y2={g.yy} stroke="#1F232A" strokeWidth={1} />
          <text
            x={W - PAD.right + 8}
            y={g.yy + 3}
            fill="#6B7280"
            fontSize={9}
            fontFamily="'JetBrains Mono', monospace"
          >
            {formatAxis(asset.id, g.v)}
          </text>
        </g>
      ))}

      {visible.map((c, i) => {
        const xc = PAD.left + (i + 0.5) * step;
        const up = c.c >= c.o;
        const col = up ? "#2FBF71" : "#FF3EA5";
        const yH = y(c.h);
        const yL = y(c.l);
        const yO = y(c.o);
        const yC = y(c.c);
        const bodyTop = Math.min(yO, yC);
        const bodyH = Math.max(1, Math.abs(yC - yO));
        return (
          <g key={c.t}>
            <line x1={xc} y1={yH} x2={xc} y2={yL} stroke={col} strokeWidth={1.2} />
            <rect
              x={xc - bodyW / 2}
              y={bodyTop}
              width={bodyW}
              height={bodyH}
              fill={col}
              stroke={col}
              strokeWidth={1}
              rx={0.8}
            />
            {i % labelEvery === 0 && (
              <text
                x={xc}
                y={H - 7}
                textAnchor="middle"
                fontSize={9}
                fill="#6B7280"
                fontFamily="'JetBrains Mono', monospace"
              >
                {candleTimeLabel(c.t, intervalMs)}
              </text>
            )}
          </g>
        );
      })}

      {lastCandle && (
        <g>
          <line
            x1={PAD.left}
            y1={lastY}
            x2={W - PAD.right}
            y2={lastY}
            stroke={lastColor}
            strokeOpacity={0.4}
            strokeDasharray="3 4"
            strokeWidth={1}
          />
          <rect x={W - PAD.right + 4} y={lastY - 8} width={PAD.right - 9} height={15} rx={3} fill="#0B0D10" opacity={0.92} />
          <text x={W - PAD.right + 8} y={lastY + 3} fontSize={9} fill={lastColor} fontFamily="'JetBrains Mono', monospace">
            {formatPrice(asset.id, lastCandle.c)}
          </text>
        </g>
      )}
    </svg>
  );
}

function ChartEngine({ asset, live }) {
  const { quotes, status } = useQuotesEngine([asset.id], live);
  const q = quotes[asset.id];
  const [timeframe, setTimeframe] = useState("M1");
  const tf = TIMEFRAMES.find((t) => t.id === timeframe) || TIMEFRAMES[0];
  const cacheKey = `${asset.id}|${tf.ms}`;
  const [candles, setCandles] = useState(() => {
    const cached = candleCache.get(cacheKey);
    return cached && cached.length ? cached : seedCandles(asset.id, seedCountFor(tf.ms), tf.ms);
  });
  const [view, setView] = useState({ start: 0, count: DEFAULT_VIEW_CANDLES });
  const [pinned, setPinned] = useState(true);

  // On mémorise la série pour la retrouver au prochain passage sur cet actif.
  useEffect(() => {
    candleCache.set(cacheKey, candles);
  }, [candles, cacheKey]);

  // Changement de temporalité → on reprend le cache s'il existe, sinon on
  // génère l'historique adapté, puis on revient au direct.
  const selectTimeframe = (id) => {
    if (id === timeframe) return;
    setTimeframe(id);
    const t = TIMEFRAMES.find((x) => x.id === id) || TIMEFRAMES[0];
    const key = `${asset.id}|${t.ms}`;
    const cached = candleCache.get(key);
    setCandles(cached && cached.length ? cached : seedCandles(asset.id, seedCountFor(t.ms), t.ms));
    setView({ start: 0, count: DEFAULT_VIEW_CANDLES });
    setPinned(true);
  };

  const chartWrapRef = useRef(null);
  const width = useMeasure(chartWrapRef);
  const pointersRef = useRef({});
  const pinchRef = useRef(null);
  const zoomRef = useRef(null);

  // Live ticks → update the current candle (open a new one every interval).
  // When a real feed lands and its price is far from our synthetic base
  // (ex. BTC réel ≠ prix de démo), we re-anchor the whole history by shifting
  // it — so the chart stays continuous instead of drawing one giant candle.
  useEffect(() => {
    if (!q) return;
    const bid = q.bid;
    const base = BASE_QUOTES[asset.id];
    const intervalMs = tf.ms;
    const BIG_JUMP = Math.max(base.step * 20, Math.abs(base.bid) * 0.01);
    setCandles((prev) => {
      const now = Date.now();
      const bucket = Math.floor(now / intervalMs) * intervalMs;
      let series = prev;
      const last = series[series.length - 1];
      if (!last) return [{ t: bucket, o: bid, h: bid, l: bid, c: bid }];
      const jump = bid - last.c;
      if (Math.abs(jump) > BIG_JUMP) {
        // re-anchor : décaler toute la série pour atterrir sur le prix réel
        series = series.map((c) => ({ ...c, o: c.o + jump, h: c.h + jump, l: c.l + jump, c: c.c + jump }));
      }
      const sLast = series[series.length - 1];
      let next;
      if (sLast.t < bucket) {
        next = [...series, { t: bucket, o: bid, h: bid, l: bid, c: bid }];
      } else {
        next = [
          ...series.slice(0, -1),
          { ...sLast, h: Math.max(sLast.h, bid), l: Math.min(sLast.l, bid), c: bid },
        ];
      }
      return next.length > MAX_CANDLES ? next.slice(next.length - MAX_CANDLES) : next;
    });
  }, [q?.bid, tf.ms]);

  // While pinned, the view stays glued to the latest candles.
  useEffect(() => {
    if (!pinned) return;
    setView((v) => ({ ...v, start: Math.max(0, candles.length - v.count) }));
  }, [candles.length, pinned]);

  const innerW = Math.max(1, (width || 320) - CHART_PAD.left - CHART_PAD.right);

  // Swipe right (dx > 0) = remonter le temps : on recule le début de la fenêtre.
  const panPx = (dx) => {
    const deltaC = (dx * view.count) / innerW;
    const maxStart = Math.max(0, candles.length - view.count);
    const start = Math.min(maxStart, Math.max(0, view.start - deltaC));
    setPinned(start >= maxStart - 1e-6);
    setView((v) => ({ ...v, start }));
  };

  // ratio > 1 → zoom avant (moins de bougies visibles).
  const zoomBy = (ratio) => {
    setView((v) => {
      const count = Math.min(MAX_VIEW_CANDLES, Math.max(MIN_VIEW_CANDLES, Math.round(v.count / ratio)));
      const maxStart = Math.max(0, candles.length - count);
      let start = pinned ? maxStart : v.start + v.count / 2 - count / 2;
      start = Math.min(maxStart, Math.max(0, start));
      return { count, start };
    });
  };

  const goLive = () => {
    setPinned(true);
    setView((v) => ({ ...v, start: Math.max(0, candles.length - v.count) }));
  };

  zoomRef.current = (factor) => zoomBy(factor);

  // Molette (desktop) — non-passive pour bloquer le scroll de la page.
  useEffect(() => {
    const el = chartWrapRef.current;
    if (!el) return;
    const onWheel = (e) => {
      e.preventDefault();
      zoomRef.current(e.deltaY < 0 ? 1.15 : 1 / 1.15);
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, []);

  const onPointerDown = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    pointersRef.current[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(pointersRef.current);
    if (ids.length === 2) {
      const [a, b] = ids.map((id) => pointersRef.current[id]);
      pinchRef.current = Math.hypot(a.x - b.x, a.y - b.y);
    } else {
      pinchRef.current = null;
    }
  };

  const onPointerMove = (e) => {
    const pts = pointersRef.current;
    if (!(e.pointerId in pts)) return;
    const prev = pts[e.pointerId];
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(pts);
    if (ids.length === 1) {
      const dx = e.clientX - prev.x;
      if (dx) panPx(dx);
    } else if (ids.length === 2) {
      const [a, b] = ids.map((id) => pts[id]);
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchRef.current && dist > 0) zoomBy(dist / pinchRef.current);
      pinchRef.current = dist;
    }
  };

  const onPointerEnd = (e) => {
    delete pointersRef.current[e.pointerId];
    pinchRef.current = null;
  };

  const base = BASE_QUOTES[asset.id];
  const bid = q ? q.bid : base.bid;
  const seriesOpen = candles.length ? candles[0].o : bid;
  const change = bid - seriesOpen;
  const changePct = seriesOpen ? (change / seriesOpen) * 100 : 0;
  const positive = change >= 0;
  const isLive = status[asset.id] === "live";
  const isError = status[asset.id] === "error";
  const bidSplit = splitPrice(asset.id, bid);

  const visible = candles.slice(view.start, view.start + view.count);
  const visHigh = visible.length ? Math.max(...visible.map((c) => c.h)) : bid;
  const visLow = visible.length ? Math.min(...visible.map((c) => c.l)) : bid;

  return (
    <div
      style={{
        background: "#14171C",
        border: "1px solid #22262D",
        borderRadius: 16,
        padding: 16,
      }}
    >
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span
              style={{
                width: 8,
                height: 8,
                borderRadius: 999,
                background: asset.color,
                boxShadow: `0 0 8px ${asset.color}`,
              }}
            />
            <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 17, fontWeight: 700, color: "#EDEBE6" }}>
              {asset.short}
            </span>
          </div>
          <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: "#6B7280", marginTop: 3 }}>
            {asset.label}
          </div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div
            style={{
              width: 8,
              height: 8,
              borderRadius: 999,
              background: isLive ? "#2FBF71" : isError ? "#E5484D" : SECONDARY,
              marginLeft: "auto",
              boxShadow: `0 0 8px ${isLive ? "#2FBF71" : isError ? "#E5484D" : SECONDARY}`,
            }}
          />
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: "#6B7280", marginTop: 6 }}>
            {isLive ? "live" : isError ? "erreur" : "simulé"}
          </div>
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginTop: 12 }}>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 26, color: PRIMARY, lineHeight: 1 }}>
          {bidSplit.head}
          <span style={{ fontWeight: 700, fontSize: 33 }}>{bidSplit.tail}</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4, paddingBottom: 4 }}>
          <div
            style={{
              display: "flex",
              alignItems: "center",
              gap: 3,
              fontFamily: "'JetBrains Mono', monospace",
              fontSize: 13,
              fontWeight: 700,
              color: positive ? "#2FBF71" : "#FF3EA5",
            }}
          >
            {positive ? <ArrowUp size={14} /> : <ArrowDown size={14} />}
            {changePct.toFixed(2)}%
          </div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "#6B7280" }}>
            {positive ? "+" : ""}
            {formatPrice(asset.id, change)}
          </div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, marginTop: 14, overflowX: "auto" }}>
        {TIMEFRAMES.map((t) => (
          <button
            key={t.id}
            onClick={() => selectTimeframe(t.id)}
            style={{
              padding: "5px 11px",
              borderRadius: 8,
              border: `1px solid ${timeframe === t.id ? SECONDARY : "#2A2E35"}`,
              background: timeframe === t.id ? `${SECONDARY}14` : "transparent",
              color: timeframe === t.id ? PRIMARY : "#7C828C",
              fontFamily: "'JetBrains Mono', monospace",
              fontSize: 11.5,
              fontWeight: 600,
              letterSpacing: 0.5,
              flexShrink: 0,
              transition: "all 0.15s ease",
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      <div ref={chartWrapRef} style={{ position: "relative", marginTop: 12, touchAction: "none" }}>
        <CandleChartSvg candles={candles} start={view.start} count={view.count} width={width} asset={asset} intervalMs={tf.ms} />
        <div
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerEnd}
          onPointerCancel={onPointerEnd}
          style={{ position: "absolute", top: 0, right: 0, bottom: 0, left: 0, touchAction: "none", cursor: "grab" }}
        />
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
        <button
          onClick={() => zoomBy(1.25)}
          aria-label="Zoomer"
          style={{
            width: 30,
            height: 30,
            borderRadius: 8,
            border: "1px solid #2A2E35",
            background: "#1B1E24",
            color: "#EDEBE6",
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 16,
            lineHeight: 1,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
          }}
        >
          +
        </button>
        <button
          onClick={() => zoomBy(0.8)}
          aria-label="Dézoomer"
          style={{
            width: 30,
            height: 30,
            borderRadius: 8,
            border: "1px solid #2A2E35",
            background: "#1B1E24",
            color: "#EDEBE6",
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 16,
            lineHeight: 1,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
          }}
        >
          −
        </button>
        <div style={{ flex: 1 }} />
        {!pinned && (
          <button
            onClick={goLive}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 6,
              padding: "6px 11px",
              borderRadius: 999,
              border: "1px solid #2FBF71",
              background: "#2FBF7114",
              color: "#2FBF71",
              fontFamily: "'JetBrains Mono', monospace",
              fontSize: 11,
              fontWeight: 600,
            }}
          >
            <span style={{ width: 6, height: 6, borderRadius: 999, background: "#2FBF71", boxShadow: "0 0 6px #2FBF71" }} />
            Retour au direct
          </button>
        )}
      </div>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "#6B7280", marginTop: 8 }}>
        Glisse vers la droite pour remonter le temps · pince ou molette pour zoomer
      </div>

      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          paddingTop: 10,
          borderTop: "1px solid #22262D",
          marginTop: 6,
        }}
      >
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: "#6B7280" }}>
          Ouv: {formatPrice(asset.id, seriesOpen)}
        </span>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: "#6B7280" }}>
          H: {formatPrice(asset.id, visHigh)}
        </span>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: "#6B7280" }}>
          B: {formatPrice(asset.id, visLow)}
        </span>
      </div>
    </div>
  );
}

function ChartTab({ live }) {
  const [assetId, setAssetId] = useState("XAUUSD");

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: "calc(100dvh - 150px)" }}>
      <ScreenHeader eyebrow="Prix en direct" title="Graphique" />

      <div style={{ padding: "0 20px" }}>
        <ChartEngine key={assetId} asset={ASSET_MAP[assetId]} live={live} />
      </div>

      <div style={{ flex: 1 }} />

      <div style={{ padding: "14px 20px 8px", borderTop: "1px solid #22262D" }}>
        <div
          style={{
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 10.5,
            letterSpacing: 1,
            color: "#6B7280",
            textTransform: "uppercase",
            marginBottom: 9,
          }}
        >
          Actif
        </div>
        <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
          {ASSETS.map((a) => (
            <AssetChip key={a.id} asset={a} active={assetId === a.id} onClick={() => setAssetId(a.id)} />
          ))}
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Bottom nav + App shell                                             */
/* ------------------------------------------------------------------ */
const TABS = [
  { id: "news", label: "Actus", icon: Newspaper },
  { id: "strategies", label: "Stratégies", icon: LineChart },
  { id: "chart", label: "Graphique", icon: CandlestickChart },
  { id: "quotes", label: "Cotations", icon: Activity },
  { id: "settings", label: "Réglages", icon: SettingsIcon },
];

// Toutes les sources temps réel sont activées par défaut — 100 % sans clé API.
const LIVE_CONFIG = {
  BTCUSD: true,
  EURUSD: true,
  aaplEnabled: true,
  xauEnabled: true,
  newsEnabled: true,
};

export default function TradingDesk() {
  const [tab, setTab] = useState("news");
  const [watchlist, setWatchlist] = useState(["XAUUSD", "BTCUSD", "EURUSD", "AAPL"]);
  const [notif, setNotif] = useState(true);
  const [highImpactOnly, setHighImpactOnly] = useState(false);

  return (
    <div
      style={{
        maxWidth: 430,
        margin: "0 auto",
        minHeight: "100vh",
        background: "#0B0D10",
        color: "#EDEBE6",
        fontFamily: "'Inter', sans-serif",
        position: "relative",
      }}
    >
      <style>{FONT_IMPORT}</style>

      <div style={{ paddingBottom: 90 }}>
        {tab === "news" && <NewsTab live={LIVE_CONFIG} />}
        {tab === "strategies" && <StrategiesTab />}
        {tab === "chart" && <ChartTab live={LIVE_CONFIG} />}
        {tab === "quotes" && <QuotesTab watchlist={watchlist.length ? watchlist : ["XAUUSD"]} live={LIVE_CONFIG} />}
        {tab === "settings" && (
          <SettingsTab
            watchlist={watchlist}
            setWatchlist={setWatchlist}
            notif={notif}
            setNotif={setNotif}
            highImpactOnly={highImpactOnly}
            setHighImpactOnly={setHighImpactOnly}
          />
        )}
      </div>

      <div
        style={{
          position: "fixed",
          bottom: 0,
          left: "50%",
          transform: "translateX(-50%)",
          width: "100%",
          maxWidth: 430,
          background: "rgba(15,17,21,0.92)",
          backdropFilter: "blur(14px)",
          borderTop: "1px solid #22262D",
          display: "flex",
          padding: "10px 6px calc(10px + env(safe-area-inset-bottom))",
        }}
      >
        {TABS.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                flex: 1,
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 4,
                padding: "6px 2px",
              }}
            >
              <Icon size={21} color={active ? PRIMARY : "#5C616A"} strokeWidth={active ? 2.3 : 2} />
              <span
                style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 10,
                  fontWeight: 600,
                  color: active ? "transparent" : "#5C616A",
                  backgroundImage: active ? GRADIENT : "none",
                  backgroundClip: active ? "text" : "unset",
                  WebkitBackgroundClip: active ? "text" : "unset",
                }}
              >
                {t.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
createRoot(rootEl).render(<TradingDesk />);
</script>
